# /opt/aws-loop/aws-jobs.conf. One line per service. Remove # to enable. Replace names with real ones.
# Order does not matter: every line runs in its own environment with its own state file.

# CloudTrail
#--bucket cloudtrail-bucket --type cloudtrail --regions ap-south-1 --only_logs_after 2026-SEP-18

# VPC Flow Logs
#--bucket vpc-bucket --type vpcflow --regions ap-south-1 --only_logs_after 2026-SEP-18

# Config
#--bucket config-bucket --type config --regions ap-south-1 --only_logs_after 2026-SEP-18

# GuardDuty
#--bucket guardduty-bucket --type guardduty --only_logs_after 2026-SEP-18

# WAF (one line per web ACL folder)
#--bucket waf-bucket --type waf --trail_prefix AWSLogs/123456789012/WAFLogs/cloudfront/acl-name --only_logs_after 2026-SEP-18

# Inspector
#--service inspector --regions ap-south-1

# CloudWatch Logs
#--service cloudwatchlogs --aws_log_groups /aws/lambda/app --regions ap-south-1 --only_logs_after 2026-SEP-18

# ECR image scanning
#--service cloudwatchlogs --aws_log_groups /aws/ecr/image-scan-findings/repo-name --regions ap-south-1 --only_logs_after 2026-SEP-18

# Security Hub
#--subscriber security_hub --queue securityhub-queue

# CloudFront
#--subscriber buckets --queue cloudfront-queue

# S3 server access logs
#--bucket s3-access-bucket --type server_access --only_logs_after 2026-SEP-18

# MongoDB Atlas
#--subscriber buckets --queue mongodb-queue
